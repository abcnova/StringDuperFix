# String Duper Fix - Deutsch -----------------------------------------
# Spielertexte verwenden MiniMessage-Formatierung.

prefix: '<gradient:#00D4FF:#0066FF><bold>String Duper Fix</bold></gradient> <dark_gray>»</dark_gray>'
no-permission: '{prefix} <red>Dafür hast du keine Berechtigung.</red>'
usage: '{prefix} <gray>Verwendung:</gray> <white>/stringduper <on|off|status|sounds|reload> [on|off|status]</white>'
enabled: '{prefix} <green>Der String-Duper ist jetzt aktiviert.</green>'
disabled: '{prefix} <yellow>Der String-Duper ist jetzt deaktiviert.</yellow>'
status-on: '{prefix} <gray>String-Duper:</gray> <green>aktiviert</green>'
status-off: '{prefix} <gray>String-Duper:</gray> <red>deaktiviert</red>'
sounds-enabled: '{prefix} <green>Die Tripwire-Farm-Sounds sind jetzt aktiviert.</green>'
sounds-disabled: '{prefix} <yellow>Die Tripwire-Farm-Sounds sind jetzt deaktiviert.</yellow>'
sounds-status-on: '{prefix} <gray>Tripwire-Farm-Sounds:</gray> <green>aktiviert</green>'
sounds-status-off: '{prefix} <gray>Tripwire-Farm-Sounds:</gray> <red>deaktiviert</red>'
reload-success: '{prefix} <green>Konfiguration, Sprachen und Sounds wurden neu geladen.</green>'
reload-failed: '{prefix} <red>Neuladen fehlgeschlagen. Prüfe die Serverkonsole; die bisherigen Einstellungen bleiben aktiv.</red>'
