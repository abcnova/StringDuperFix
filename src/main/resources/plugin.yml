name: StringDuperFix
version: 1.0.0
main: de.abc_nova.stringduperfix.StringDuperFixPlugin
api-version: '1.21'
author: ABC_Nova
website: https://github.com/abcnova/StringDuperFix
description: Restores controlled string dupers from Minecraft 1.21.2 through 26.3 on Paper-compatible servers.
commands:
  stringduper:
    description: Controls personal farm sounds and, for admins, the live mechanic.
    aliases: [tripwirerevival, twrevival]
    usage: '/stringduper <on|off|status|sounds|reload> [on|off|status]'
permissions:
  stringduper.admin:
    description: Allows administrators to manage String Duper Fix.
    default: op
