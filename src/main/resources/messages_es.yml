# String Duper Fix - Español -----------------------------------------
# Los mensajes para jugadores utilizan el formato MiniMessage.

prefix: '<gradient:#00D4FF:#0066FF><bold>String Duper Fix</bold></gradient> <dark_gray>»</dark_gray>'
no-permission: '{prefix} <red>No tienes permiso para hacer eso.</red>'
usage: '{prefix} <gray>Uso:</gray> <white>/stringduper <on|off|status|sounds|reload> [on|off|status]</white>'
enabled: '{prefix} <green>El duplicador de hilo está activado.</green>'
disabled: '{prefix} <yellow>El duplicador de hilo está desactivado.</yellow>'
status-on: '{prefix} <gray>Duplicador de hilo:</gray> <green>activado</green>'
status-off: '{prefix} <gray>Duplicador de hilo:</gray> <red>desactivado</red>'
sounds-enabled: '{prefix} <green>Los sonidos de las granjas de hilo están activados.</green>'
sounds-disabled: '{prefix} <yellow>Los sonidos de las granjas de hilo están desactivados.</yellow>'
sounds-status-on: '{prefix} <gray>Sonidos de granjas de hilo:</gray> <green>activados</green>'
sounds-status-off: '{prefix} <gray>Sonidos de granjas de hilo:</gray> <red>desactivados</red>'
reload-success: '{prefix} <green>Se recargaron la configuración, los idiomas y los sonidos.</green>'
reload-failed: '{prefix} <red>No se pudo recargar. Revisa la consola; la configuración anterior sigue activa.</red>'
