# String Duper Fix - English -----------------------------------------
# Player-facing messages use MiniMessage formatting.

prefix: '<gradient:#00D4FF:#0066FF><bold>String Duper Fix</bold></gradient> <dark_gray>»</dark_gray>'
no-permission: '{prefix} <red>You do not have permission to do that.</red>'
usage: '{prefix} <gray>Usage:</gray> <white>/stringduper <on|off|status|sounds|reload> [on|off|status]</white>'
player-only: '{prefix} <red>This personal sound command can only be used by a player.</red>'
enabled: '{prefix} <green>The string duper is now enabled.</green>'
disabled: '{prefix} <yellow>The string duper is now disabled.</yellow>'
status-on: '{prefix} <gray>String duper:</gray> <green>enabled</green>'
status-off: '{prefix} <gray>String duper:</gray> <red>disabled</red>'
sounds-enabled: '{prefix} <green>Tripwire farm sounds are now enabled for you.</green>'
sounds-disabled: '{prefix} <yellow>Tripwire farm sounds are now disabled for you.</yellow>'
sounds-status-on: '{prefix} <gray>Your tripwire farm sounds:</gray> <green>enabled</green>'
sounds-status-off: '{prefix} <gray>Your tripwire farm sounds:</gray> <red>disabled</red>'
reload-success: '{prefix} <green>Configuration, languages, and sounds were reloaded.</green>'
reload-failed: '{prefix} <red>Reload failed. Check the server console; the previous settings remain active.</red>'
